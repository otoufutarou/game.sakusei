<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F5F0E6">
    <title>灯火の一生</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <strong class="wordmark">灯火の一生</strong>
        <span class="world-status" id="world-status">世界は穏やかです</span>
        <nav class="top-actions">
          <button class="chip-button" id="open-history" type="button">記録</button>
          <button class="chip-button" id="new-life" type="button">新しい人生</button>
        </nav>
      </header>

      <section class="hero-card" aria-label="主人公">
        <div class="hero-head">
          <div>
            <h1 id="character-name">---</h1>
            <p id="character-summary" class="hero-sub">生まれたばかり</p>
          </div>
          <span class="age-badge" id="age-badge">0歳</span>
        </div>
        <div class="quick-stats">
          <button type="button" class="quick-stat" id="open-status"><small>職業</small><strong id="occupation-value">---</strong></button>
          <div class="quick-stat static"><small>健康</small><strong id="health-value">健やか</strong></div>
          <button type="button" class="quick-stat" id="open-money"><small>所持金</small><strong id="gold-value">0G</strong></button>
        </div>
        <div class="character-scene" data-region="kingdom">
          <canvas id="character-canvas" width="400" height="150" role="img" aria-label="人生の道を歩む主人公のドット絵"></canvas>
          <span class="scene-caption" id="scene-caption"></span>
        </div>
        <p class="family-line" id="people-value">家族</p>
        <button class="link-button" id="open-status-2" type="button">詳細ステータス ›</button>
      </section>

      <section class="log-card" aria-labelledby="journal-heading">
        <div class="log-head">
          <h2 id="journal-heading">最近の出来事</h2>
          <span class="log-count"><span id="event-count">0</span> 件</span>
        </div>
        <ol class="event-list" id="event-list" aria-live="polite" aria-relevant="additions"></ol>
        <button class="link-button" id="open-history-inline" type="button">過去の記録をすべて見る ›</button>
      </section>

      <section class="controls-bar" aria-label="進行の操作">
        <div class="control-buttons">
          <button class="primary-control" id="toggle-play" type="button" aria-label="一時停止">Ⅱ <span>一時停止</span></button>
          <button class="secondary-control" id="next-decision" type="button">次の選択まで →</button>
        </div>
        <div class="speed-row">
          <span class="flow-indicator" id="flow-indicator"><i></i>進行中</span>
          <div class="speed-options" role="group" aria-label="再生速度">
            <button type="button" data-speed="1" class="selected" aria-pressed="true">1×</button>
            <button type="button" data-speed="2" aria-pressed="false">2×</button>
            <button type="button" data-speed="4" aria-pressed="false">4×</button>
            <button type="button" data-speed="8" aria-pressed="false">8×</button>
          </div>
        </div>
      </section>

      <footer class="build-line"><span id="build-id">build: dev</span></footer>

      <section class="history-page" id="history-page" hidden aria-labelledby="history-heading">
        <header class="log-head">
          <h2 id="history-heading">人生の記録</h2>
          <button class="chip-button" id="close-history" type="button">ゲームに戻る</button>
        </header>
        <ol class="event-list history-list" id="history-list"></ol>
      </section>
    </main>

    <dialog class="game-dialog" id="prologue-dialog" aria-labelledby="prologue-title">
      <h2 id="prologue-title">あなたの生まれた家</h2>
      <p class="dialog-copy" id="prologue-copy"></p>
      <div class="record-grid" id="birth-record"></div>
      <p class="dialog-note" id="prologue-note"></p>
      <button class="primary-control wide" id="begin-life" type="button">人生を始める →</button>
      <button class="link-button" id="resume-life" type="button" hidden>保存した人生を続ける</button>
    </dialog>

    <dialog class="game-dialog" id="decision-dialog" aria-labelledby="decision-title">
      <p class="dialog-age" id="decision-age"></p>
      <h2 id="decision-title">選択</h2>
      <p class="dialog-copy" id="decision-copy"></p>
      <div class="choice-list" id="choice-list"></div>
    </dialog>

    <dialog class="game-dialog" id="result-dialog" aria-labelledby="result-title">
      <p class="dialog-age" id="result-choice"></p>
      <h2 id="result-title">結果</h2>
      <p class="dialog-copy" id="result-message"></p>
      <ul class="result-list" id="result-details"></ul>
      <button class="primary-control wide" id="close-result" type="button">続ける</button>
    </dialog>

    <dialog class="game-dialog wide-dialog" id="status-dialog" aria-labelledby="status-title">
      <header class="dialog-bar"><h2 id="status-title">詳細ステータス</h2><button class="chip-button" data-close="status-dialog" type="button">閉じる</button></header>
      <div id="status-body" class="detail-body"></div>
    </dialog>

    <dialog class="game-dialog wide-dialog" id="money-dialog" aria-labelledby="money-title">
      <header class="dialog-bar"><h2 id="money-title">所持金の内訳</h2><button class="chip-button" data-close="money-dialog" type="button">閉じる</button></header>
      <div id="money-body" class="detail-body"></div>
    </dialog>

    <dialog class="game-dialog" id="ending-dialog" aria-labelledby="ending-title">
      <h2 id="ending-title">ひとつの人生が終わりました</h2>
      <p class="dialog-copy" id="ending-copy"></p>
      <div class="record-grid" id="ending-record"></div>
      <button class="primary-control wide" id="ending-new-life" type="button">新しい人生を始める →</button>
      <button class="link-button" id="ending-history" type="button">人生の記録を見る ›</button>
    </dialog>
  </body>
</html>
