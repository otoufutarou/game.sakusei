name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --experimental-default-type=module --test src/simulation.test.js
      - name: Browser integration test (headless Chromium)
        run: CHROMIUM_PATH="$(which google-chrome || which chromium)" npm run test:browser
